<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人掷骰子</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto 20px auto;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.8rem;
            color: #6366f1;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #475569;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }

        .btn-danger {
            background-color: #ef4444;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        /* 玩家窗口网格布局 */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 玩家独立窗口卡片 */
        .player-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text);
            font-size: 1.2rem;
            font-weight: bold;
            width: 60%;
            padding: 2px 4px;
        }

        .player-name:focus {
            outline: none;
            border-bottom-color: var(--primary);
        }

        /* 控制面板配置 */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .control-group input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.9rem;
            width: 100%;
        }

        /* 3D 骰子区域 */
        .dice-stage {
            height: 140px;
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 10px;
            overflow-y: auto;
            perspective: 1000px;
        }

        /* 3D 立方体 CSS */
        .scene {
            width: 50px;
            height: 50px;
            perspective: 400px;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .cube-face {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            color: #1e293b;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        /* 立方体 6 个面位置 */
        .face-front  { transform: rotateY(0deg) translateZ(25px); }
        .face-back   { transform: rotateY(180deg) translateZ(25px); }
        .face-right  { transform: rotateY(90deg) translateZ(25px); }
        .face-left   { transform: rotateY(-90deg) translateZ(25px); }
        .face-top    { transform: rotateX(90deg) translateZ(25px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(25px); }

        /* 结果与统计 */
        .result-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .total-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ade80;
        }

        /* 历史记录 */
        .history-section {
            font-size: 0.85rem;
        }

        .history-title {
            color: var(--text-dim);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }

        .history-list {
            max-height: 80px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--text-dim);
        }

        .history-item .val {
            color: var(--text);
        }

        /* Rolling 动画 */
        .rolling {
            animation: spin 0.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎲 多人掷骰子</h1>
        <div class="header-controls">
            <button class="btn btn-secondary" id="soundToggleBtn" onclick="toggleSound()">🔊 音效: 开</button>
            <button class="btn" onclick="addPlayer()">+ 添加玩家/窗口</button>
        </div>
    </header>

    <div class="players-grid" id="playersContainer">
        <!-- 玩家窗口会动态插入到这里 -->
    </div>

    <script>
        let playerCount = 0;
        let isSoundEnabled = true;
        let audioCtx = null;

        // 初始化 Web Audio API (音效合成引擎)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 切换音效开关
        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            btn.innerText = isSoundEnabled ? '🔊 音效: 开' : '🔇 音效: 关';
        }

        // 合成逼真的骰子撞击/滚动音效
        function playDiceRollSound(diceCount) {
            if (!isSoundEnabled) return;
            initAudio();

            const now = audioCtx.currentTime;
            const duration = 0.8; // 音效持续时间，与动画匹配
            // 骰子越多，碰撞声越密集
            const baseHits = 6;
            const extraHits = Math.min(diceCount * 3, 12);
            const totalHits = baseHits + extraHits;

            for (let i = 0; i < totalHits; i++) {
                // 模拟撞击频率：开始快，后面逐渐慢下来
                const progress = i / totalHits;
                const timeOffset = Math.pow(progress, 1.8) * duration;
                const hitTime = now + timeOffset;

                // 产生一次撞击声音
                createDiceHitSound(hitTime);
            }
        }

        // 产生单次“哒”的骰子撞击声
        function createDiceHitSound(time) {
            // 1. 噪声部分（模拟骰子碰撞的质感）
            const bufferSize = audioCtx.sampleRate * 0.03; // 30毫秒超短噪声
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            // 滤波：使声音听起来像硬塑料/木头撞击
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(800 + Math.random() * 800, time);
            filter.Q.setValueAtTime(3, time);

            const gain = audioCtx.createGain();
            // 音量衰减曲线
            gain.gain.setValueAtTime(0.3 + Math.random() * 0.2, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start(time);

            // 2. 模拟桌面的低频“咚”声
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120 + Math.random() * 40, time);
            osc.frequency.exponentialRampToValueAtTime(30, time + 0.04);

            oscGain.gain.setValueAtTime(0.2, time);
            oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);

            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);

            osc.start(time);
            osc.stop(time + 0.04);
        }

        // 初始化添加一个玩家
        window.onload = () => {
            addPlayer("玩家 1");
        };

        // 添加新的玩家窗口
        function addPlayer(defaultName = null) {
            playerCount++;
            const id = 'player-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            const name = defaultName || `玩家 ${playerCount}`;

            const playerCard = document.createElement('div');
            playerCard.className = 'player-card';
            playerCard.id = id;

            playerCard.innerHTML = `
                <div class="player-header">
                    <input type="text" class="player-name" value="${name}">
                    <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="removePlayer('${id}')">删除</button>
                </div>
                
                <div class="controls">
                    <div class="control-group">
                        <label>最小值</label>
                        <input type="number" class="input-min" value="1">
                    </div>
                    <div class="control-group">
                        <label>最大值(面数)</label>
                        <input type="number" class="input-max" value="6">
                    </div>
                    <div class="control-group">
                        <label>骰子数量</label>
                        <input type="number" class="input-count" value="1" min="1" max="10">
                    </div>
                </div>

                <button class="btn" onclick="rollDice('${id}')">🎲 摇骰子！</button>

                <div class="dice-stage" id="stage-${id}"></div>

                <div class="result-panel">
                    <span>总计得分:</span>
                    <span class="total-score" id="total-${id}">0</span>
                </div>

                <div class="history-section">
                    <div class="history-title" onclick="toggleHistory('${id}')">
                        <span>历史记录</span>
                        <span id="arrow-${id}">▼</span>
                    </div>
                    <div class="history-list" id="history-${id}"></div>
                </div>
            `;

            document.getElementById('playersContainer').appendChild(playerCard);
            renderDicePlaceholders(id);
        }

        // 删除玩家窗口
        function removePlayer(id) {
            const card = document.getElementById(id);
            if (card) {
                card.remove();
            }
        }

        // 渲染初始/静态骰子
        function renderDicePlaceholders(id) {
            const card = document.getElementById(id);
            const count = parseInt(card.querySelector('.input-count').value) || 1;
            const stage = document.getElementById(`stage-${id}`);
            stage.innerHTML = '';

            for (let i = 0; i < count; i++) {
                stage.appendChild(createCubeHTML('?'));
            }
        }

        // 创建 3D 骰子 DOM 结构
        function createCubeHTML(text) {
            const scene = document.createElement('div');
            scene.className = 'scene';
            
            const cube = document.createElement('div');
            cube.className = 'cube';
            
            const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
            faces.forEach(faceName => {
                const face = document.createElement('div');
                face.className = `cube-face face-${faceName}`;
                face.innerText = text;
                cube.appendChild(face);
            });

            scene.appendChild(cube);
            return scene;
        }

        // 核心逻辑：摇骰子
        function rollDice(id) {
            const card = document.getElementById(id);
            const min = parseInt(card.querySelector('.input-min').value);
            const max = parseInt(card.querySelector('.input-max').value);
            const count = parseInt(card.querySelector('.input-count').value);
            const stage = document.getElementById(`stage-${id}`);
            const totalEl = document.getElementById(`total-${id}`);

            if (min >= max) {
                alert("最小值必须小于最大值！");
                return;
            }
            if (count < 1 || count > 20) {
                alert("骰子数量请在 1 到 20 之间！");
                return;
            }

            // 1. 播放物理碰撞合成音效
            playDiceRollSound(count);

            // 2. 清空 stage 并重新渲染骰子
            stage.innerHTML = '';
            let results = [];
            let cubes = [];

            for (let i = 0; i < count; i++) {
                const rand = Math.floor(Math.random() * (max - min + 1)) + min;
                results.push(rand);

                const scene = createCubeHTML(rand);
                const cube = scene.querySelector('.cube');
                
                cube.classList.add('rolling');
                stage.appendChild(scene);
                cubes.push(cube);
            }

            // 3. 动画停止并更新结果
            setTimeout(() => {
                let total = 0;
                results.forEach((res, index) => {
                    total += res;
                    const cube = cubes[index];
                    cube.classList.remove('rolling');

                    // 随机落地角度
                    const xRot = Math.floor(Math.random() * 4) * 90;
                    const yRot = Math.floor(Math.random() * 4) * 90;
                    cube.style.transform = `rotateX(${xRot}deg) rotateY(${yRot}deg)`;

                    // 把所有面都设为当前骰子掷出的值，保证正面看始终正确
                    cube.querySelectorAll('.cube-face').forEach(f => f.innerText = res);
                });

                // 显示总得分
                totalEl.innerText = total;

                // 保存历史记录
                addHistory(id, results, total);

            }, 800); // 800ms 动画和声音同步
        }

        // 添加历史记录
        function addHistory(id, results, total) {
            const historyList = document.getElementById(`history-${id}`);
            const time = new Date().toLocaleTimeString();
            
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <span>${time}</span>
                <span class="val">[${results.join(', ')}] = <strong>${total}</strong></span>
            `;
            
            historyList.insertBefore(item, historyList.firstChild);
        }

        // 展开/收起历史记录
        function toggleHistory(id) {
            const list = document.getElementById(`history-${id}`);
            const arrow = document.getElementById(`arrow-${id}`);
            if (list.style.display === 'none') {
                list.style.display = 'flex';
                arrow.innerText = '▼';
            } else {
                list.style.display = 'none';
                arrow.innerText = '▲';
            }
        }
    </script>
</body>
</html>
