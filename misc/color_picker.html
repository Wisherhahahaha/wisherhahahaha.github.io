<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取色器</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #111827;
        }

        .picker-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-bottom: 25px;
        }

        .picker-btn:hover {
            background-color: var(--primary-hover);
        }

        .preview-box {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #e5e7eb;
            background-color: #eeeeee;
            transition: background-color 0.1s;
        }

        .unsupported-message {
            color: #dc2626;
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            font-size: 0.9rem;
        }

        .color-values {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .value-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f9fafb;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #f3f4f6;
        }

        .format-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #6b7280;
            width: 60px;
            text-align: left;
        }

        .color-text {
            font-family: monospace;
            font-size: 0.95rem;
            color: #374151;
            flex-grow: 1;
            text-align: left;
            padding: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .copy-btn {
            background-color: #e5e7eb;
            color: #374151;
            border: none;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background-color: #d1d5db;
        }

        .copy-btn.copied {
            background-color: #10b981;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>取色器</h1>
    
    <div id="unsupported" class="unsupported-message">
        您的浏览器暂不支持 EyeDropper API，请尝试使用 Chrome、Edge 或 Opera 浏览器。
    </div>

    <button id="pick-btn" class="picker-btn">开始取色</button>
    
    <div id="preview" class="preview-box"></div>

    <div class="color-values">
        <div class="value-row">
            <span class="format-label">HEX</span>
            <span id="hex-val" class="color-text">#EEEEEE</span>
            <button class="copy-btn" onclick="copyValue('hex-val', this)">复制</button>
        </div>
        <div class="value-row">
            <span class="format-label">RGB</span>
            <span id="rgb-val" class="color-text">rgb(238, 238, 238)</span>
            <button class="copy-btn" onclick="copyValue('rgb-val', this)">复制</button>
        </div>
        <div class="value-row">
            <span class="format-label">HSL</span>
            <span id="hsl-val" class="color-text">hsl(0, 0%, 93%)</span>
            <button class="copy-btn" onclick="copyValue('hsl-val', this)">复制</button>
        </div>
    </div>
</div>

<script>
    const pickBtn = document.getElementById('pick-btn');
    const preview = document.getElementById('preview');
    const hexVal = document.getElementById('hex-val');
    const rgbVal = document.getElementById('rgb-val');
    const hslVal = document.getElementById('hsl-val');
    const unsupportedMsg = document.getElementById('unsupported');

    // 检测浏览器是否支持 EyeDropper
    if (!('EyeDropper' in window)) {
        unsupportedMsg.style.display = 'block';
        pickBtn.disabled = true;
        pickBtn.style.backgroundColor = '#9ca3af';
        pickBtn.style.cursor = 'not-allowed';
    } else {
        const eyeDropper = new EyeDropper();

        pickBtn.addEventListener('click', async () => {
            try {
                // 启动取色器
                const result = await eyeDropper.open();
                const hex = result.sRGBHex; // 获取到的十六进制颜色值
                
                // 更新UI
                updateColorOutputs(hex);
            } catch (err) {
                // 用户取消了取色或发生错误
                console.log('取色已取消或失败:', err);
            }
        });
    }

    // 更新各个格式的颜色值
    function updateColorOutputs(hex) {
        preview.style.backgroundColor = hex;
        hexVal.textContent = hex.toUpperCase();

        const rgb = hexToRgb(hex);
        rgbVal.textContent = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

        const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
        hslVal.textContent = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
    }

    // 复制功能
    async function copyValue(elementId, button) {
        const textToCopy = document.getElementById(elementId).textContent;
        try {
            await navigator.clipboard.writeText(textToCopy);
            
            // 复制成功的视觉反馈
            const originalText = button.textContent;
            button.textContent = '已复制';
            button.classList.add('copied');
            
            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
            }, 1500);
        } catch (err) {
            alert('复制失败，请手动复制');
        }
    }

    // 辅助函数：HEX 转 RGB
    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return { r, g, b };
    }

    // 辅助函数：RGB 转 HSL
    function rgbToHsl(r, g, b) {
        r /= 255;
        g /= 255;
        b /= 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;

        if (max === min) {
            h = s = 0; // 灰色
        } else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }

        return {
            h: Math.round(h * 360),
            s: Math.round(s * 100),
            l: Math.round(l * 100)
        };
    }
</script>
</body>
</html>
